<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>苏打绿 - 小情歌</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
#controls {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 100;
}
button {
  padding: 10px 24px; border: none; border-radius: 25px;
  background: rgba(255,255,255,0.15); color: #fff; font-size: 14px;
  cursor: pointer; backdrop-filter: blur(10px);
  transition: background 0.3s;
}
button:hover { background: rgba(255,255,255,0.3); }
button.recording { background: #e74c3c; }
#status {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.8); font-size: 14px; z-index: 100;
  font-family: "Microsoft YaHei", sans-serif;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">准备就绪</div>
<div id="controls">
  <button id="btnGenerate">生成视频</button>
  <button id="btnDownload" disabled>下载视频</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 设置画布大小 (720p)
const W = 1280, H = 720;
canvas.width = W;
canvas.height = H;

// 歌词数据 - 苏打绿《小情歌》
const lyrics = [
  { text: "这是一首简单的小情歌", startTime: 0, duration: 4 },
  { text: "唱着人们心肠的曲折", startTime: 4, duration: 4 },
  { text: "我想我很快乐", startTime: 8, duration: 3.5 },
  { text: "当有你的温热", startTime: 11.5, duration: 3.5 },
  { text: "脚边的空气转了", startTime: 15, duration: 3.5 },
  { text: "这是一首简单的小情歌", startTime: 18.5, duration: 4 },
  { text: "唱着我们心头的白鸽", startTime: 22.5, duration: 4 },
  { text: "我很快乐", startTime: 26.5, duration: 3 },
  { text: "因为你的微笑", startTime: 29.5, duration: 3.5 },
  { text: "和温暖双手", startTime: 33, duration: 3 },
  { text: "这是一首简单的小情歌", startTime: 36, duration: 4 },
  { text: "唱着我们心头的白鸽", startTime: 40, duration: 4 },
  { text: "我想我很适合", startTime: 44, duration: 3.5 },
  { text: "当一个歌颂者", startTime: 47.5, duration: 3.5 },
  { text: "啦啦啦啦啦", startTime: 51, duration: 8 },
  { text: "这是一首简单的小情歌", startTime: 59, duration: 4 },
  { text: "唱着我们心头的白鸽", startTime: 63, duration: 4 },
  { text: "我很快乐", startTime: 67, duration: 3 },
  { text: "因为你的微笑", startTime: 70, duration: 3.5 },
  { text: "和温暖双手", startTime: 73.5, duration: 3 },
  { text: "这是一首简单的小情歌", startTime: 76.5, duration: 4 },
  { text: "唱着我们心头的白鸽", startTime: 80.5, duration: 4 },
  { text: "我想我很适合", startTime: 84.5, duration: 3.5 },
  { text: "当一个歌颂者", startTime: 88, duration: 3.5 },
  { text: "啦啦啦啦啦", startTime: 91.5, duration: 8 },
  { text: "这是一首简单的小情歌", startTime: 99.5, duration: 4 },
  { text: "唱着我们心头的白鸽", startTime: 103.5, duration: 4 },
  { text: "我很快乐", startTime: 107.5, duration: 3 },
  { text: "因为你的微笑", startTime: 110.5, duration: 3.5 },
  { text: "和温暖双手", startTime: 114, duration: 3 },
];

const TOTAL_DURATION = 120; // 总时长 120 秒

// ========== 音频系统 ==========
let audioCtx = null;
let masterGain = null;
let audioStarted = false;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.35;
  masterGain.connect(audioCtx.destination);
}

// 播放一个音符
function playNote(freq, time, duration, type = 'sine', volume = 0.3) {
  if (!audioCtx) return;
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = type;
  osc.frequency.value = freq;
  
  // 包络
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(volume, time + 0.05);
  gain.gain.exponentialRampToValueAtTime(volume * 0.7, time + duration * 0.3);
  gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
  
  osc.connect(gain);
  gain.connect(masterGain);
  
  osc.start(time);
  osc.stop(time + duration + 0.1);
}

// 播放和弦
function playChord(freqs, time, duration, type = 'sine', volume = 0.15) {
  freqs.forEach(f => playNote(f, time, duration, type, volume));
}

// 简单旋律生成 - 基于《小情歌》风格的轻快旋律
const MELODY_NOTES = [
  // [时间(秒), 频率, 时长]
  // 第一段 - 简单温暖的前奏
  [0, 523.25, 0.5], [0.5, 587.33, 0.5], [1, 659.25, 0.5], [1.5, 783.99, 0.5],
  [2, 659.25, 0.5], [2.5, 587.33, 0.5], [3, 523.25, 1],
  // 副歌部分
  [4, 783.99, 0.5], [4.5, 880, 0.5], [5, 783.99, 0.5], [5.5, 659.25, 0.5],
  [6, 587.33, 0.5], [6.5, 523.25, 0.5], [7, 440, 1],
  // 第二段
  [8, 523.25, 0.5], [8.5, 659.25, 0.5], [9, 783.99, 0.5], [9.5, 880, 0.5],
  [10, 783.99, 0.5], [10.5, 659.25, 0.5], [11, 587.33, 1],
  [12, 523.25, 0.5], [12.5, 587.33, 0.5], [13, 659.25, 0.5], [13.5, 783.99, 0.5],
  [14, 880, 0.5], [14.5, 783.99, 0.5], [15, 659.25, 1],
];

// 和弦进行
const CHORDS = [
  [261.63, 329.63, 392.00],   // C
  [293.66, 369.99, 440.00],   // Dm
  [349.23, 440.00, 523.25],   // F
  [392.00, 493.88, 587.33],   // G
  [220.00, 277.18, 329.63],   // Am
];

// 生成背景音乐
function generateBackgroundMusic(audioStartTime) {
  if (!audioCtx) return;
  
  // 生成循环和弦进行
  for (let section = 0; section < 8; section++) {
    const sectionStart = audioStartTime + section * 15;
    const chordIdx = section % 5;
    
    // 每15秒一个乐段，每个乐段4个和弦
    for (let bar = 0; bar < 4; bar++) {
      const barTime = sectionStart + bar * 3.75;
      const cIdx = (chordIdx + bar) % 5;
      playChord(CHORDS[cIdx], barTime, 3.5, 'sine', 0.08);
      
      // 贝斯
      playNote(CHORDS[cIdx][0] / 2, barTime, 3.5, 'triangle', 0.15);
      
      // 分解和弦
      for (let note = 0; note < 4; note++) {
        const nTime = barTime + note * 0.9;
        const freq = CHORDS[cIdx][note % 3] * 2;
        playNote(freq, nTime, 0.8, 'sine', 0.1);
      }
    }
    
    // 每段末尾加个小高音旋律
    for (let m = 0; m < 8; m++) {
      const mTime = sectionStart + m * 1.8;
      const freqs = [523.25, 587.33, 659.25, 783.99, 880, 783.99, 659.25, 587.33];
      playNote(freqs[m % 8], mTime, 1.2, 'sine', 0.12);
    }
  }
}

// ========== 视觉系统 ==========
// 粒子系统
class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 3 + 1;
    this.speedX = (Math.random() - 0.5) * 1.5;
    this.speedY = (Math.random() - 0.5) * 1.5;
    this.opacity = Math.random() * 0.6 + 0.2;
    this.hue = Math.random() * 60 + 30;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.life--;
    if (this.life <= 0 || this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) this.reset();
  }
  draw(ctx) {
    const alpha = this.opacity * (this.life / this.maxLife);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${alpha})`;
    ctx.fill();
  }
}

// 星星背景
class Star {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 2 + 0.5;
    this.twinkleSpeed = Math.random() * 0.05 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
  }
  draw(ctx, time) {
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(time * this.twinkleSpeed + this.phase));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.fill();
  }
}

// 音符飘浮
class Note {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 20;
    this.speed = Math.random() * 1.5 + 0.5;
    this.size = Math.random() * 20 + 14;
    this.opacity = Math.random() * 0.5 + 0.2;
    this.char = ['♪', '♫', '♬', '♩', '♭', '♮'][Math.floor(Math.random() * 6)];
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.01;
  }
  update() {
    this.y -= this.speed;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * 0.5;
    if (this.y < -30) this.reset();
  }
  draw(ctx) {
    ctx.font = `${this.size}px serif`;
    ctx.fillStyle = `rgba(255, 220, 180, ${this.opacity})`;
    ctx.fillText(this.char, this.x, this.y);
  }
}

// 音频可视化条
class AudioVisualizer {
  constructor() {
    this.bars = 64;
  }
  draw(ctx, time, centerX, centerY) {
    for (let i = 0; i < this.bars; i++) {
      const angle = (i / this.bars) * Math.PI * 2 - Math.PI / 2;
      const wave = Math.sin(time * 3 + i * 0.3) * 0.5 + 0.5;
      const wave2 = Math.sin(time * 2 + i * 0.5) * 0.5 + 0.5;
      const height = (wave * wave2) * 80 + 20;
      const x = centerX + Math.cos(angle) * 120;
      const y = centerY + Math.sin(angle) * 120;
      const hue = 30 + (i / this.bars) * 40;
      ctx.beginPath();
      ctx.arc(x, y, height / 3 + 5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.3 + wave * 0.4})`;
      ctx.fill();
    }
  }
}

// 初始化视觉对象
const particles = Array.from({ length: 80 }, () => new Particle());
const stars = Array.from({ length: 120 }, () => new Star());
const notes = Array.from({ length: 20 }, () => new Note());
const visualizer = new AudioVisualizer();

// 缓动函数
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// 绘制背景渐变
function drawBackground(time) {
  const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
  gradient.addColorStop(0, '#1a0a2e');
  gradient.addColorStop(0.5, '#0d1b3e');
  gradient.addColorStop(1, '#050a18');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

// 绘制歌词
function drawLyrics(time) {
  const centerX = W / 2;
  const centerY = H / 2 - 40;
  
  for (let i = 0; i < lyrics.length; i++) {
    const line = lyrics[i];
    const localTime = time - line.startTime;
    
    if (localTime < 0 || localTime > line.duration) continue;
    
    const progress = localTime / line.duration;
    let alpha = 1;
    let scale = 1;
    let yOffset = 0;
    
    if (progress < 0.15) {
      const t = progress / 0.15;
      alpha = easeOutCubic(t);
      scale = 0.8 + 0.2 * easeOutCubic(t);
      yOffset = 30 * (1 - easeOutCubic(t));
    } else if (progress > 0.75) {
      const t = (progress - 0.75) / 0.25;
      alpha = 1 - t;
      scale = 1 + 0.1 * t;
      yOffset = -20 * t;
    }
    
    ctx.save();
    ctx.translate(centerX, centerY + yOffset + (i % 2 === 0 ? -60 : 60));
    ctx.scale(scale, scale);
    ctx.shadowColor = `rgba(255, 200, 100, ${alpha * 0.8})`;
    ctx.shadowBlur = 30;
    ctx.font = `bold 52px "Microsoft YaHei", "PingFang SC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const textGradient = ctx.createLinearGradient(-200, 0, 200, 0);
    textGradient.addColorStop(0, `rgba(255, 220, 180, ${alpha})`);
    textGradient.addColorStop(0.5, `rgba(255, 255, 255, ${alpha})`);
    textGradient.addColorStop(1, `rgba(255, 220, 180, ${alpha})`);
    ctx.fillStyle = textGradient;
    ctx.fillText(line.text, 0, 0);
    ctx.restore();
  }
}

// 绘制歌曲信息
function drawSongInfo(time) {
  const alpha = time < 3 ? Math.min(time / 1.5, 1) : (time > TOTAL_DURATION - 3 ? Math.max((TOTAL_DURATION - time) / 1.5, 0) : 1);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `28px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 200, 150, 0.7)';
  ctx.fillText('苏打绿', W / 2, H - 100);
  ctx.font = `bold 36px "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = 'rgba(255, 230, 180, 0.9)';
  ctx.fillText('小情歌', W / 2, H - 60);
  ctx.restore();
}

// 绘制进度条
function drawProgressBar(time) {
  const progress = time / TOTAL_DURATION;
  const barWidth = W * 0.6;
  const barX = (W - barWidth) / 2;
  const barY = H - 30;
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(barX, barY, barWidth, 4);
  const gradient = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
  gradient.addColorStop(0, '#ff9966');
  gradient.addColorStop(1, '#ff5e62');
  ctx.fillStyle = gradient;
  ctx.fillRect(barX, barY, barWidth * progress, 4);
}

// ========== 录制系统 ==========
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let startTime = 0;
let animationId = null;

function render(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) / 1000;
  const time = Math.min(elapsed, TOTAL_DURATION);
  
  drawBackground(time);
  stars.forEach(star => star.draw(ctx, time));
  notes.forEach(note => { note.update(); note.draw(ctx); });
  particles.forEach(p => { p.update(); p.draw(ctx); });
  visualizer.draw(ctx, time, W/2, H/2);
  drawLyrics(time);
  drawSongInfo(time);
  drawProgressBar(time);
  
  // 更新状态
  const status = document.getElementById('status');
  if (status) {
    const pct = Math.round((time / TOTAL_DURATION) * 100);
    status.textContent = `录制中... ${pct}% (${Math.round(time)}s / ${TOTAL_DURATION}s)`;
  }
  
  if (elapsed < TOTAL_DURATION) {
    animationId = requestAnimationFrame(render);
  } else {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      setTimeout(() => mediaRecorder.stop(), 500);
    }
    isRecording = false;
    document.getElementById('btnGenerate').textContent = '生成视频';
    document.getElementById('btnGenerate').classList.remove('recording');
    document.getElementById('btnDownload').disabled = false;
    document.getElementById('status').textContent = '录制完成！';
  }
}

async function startRecording() {
  recordedChunks = [];
  document.getElementById('btnGenerate').textContent = '录制中...';
  document.getElementById('btnGenerate').classList.add('recording');
  document.getElementById('btnDownload').disabled = true;
  document.getElementById('status').textContent = '初始化音频...';
  
  try {
    // 1. 初始化音频上下文
    initAudio();
    
    // 2. 创建画布视频流
    const videoStream = canvas.captureStream(30);
    
    // 3. 创建音频流
    const audioDest = audioCtx.createMediaStreamDestination();
    const audioGain = audioCtx.createGain();
    audioGain.gain.value = 1;
    
    // 连接到音频输出和录制
    masterGain.connect(audioGain);
    audioGain.connect(audioCtx.destination);
    audioGain.connect(audioDest);
    
    // 4. 合并音视频流 (audioDest.stream 才是真正的 MediaStream)
    const combinedStream = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...audioDest.stream.getAudioTracks()
    ]);
    
    // 5. 选择编码器
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') 
      ? 'video/webm;codecs=vp9,opus' 
      : MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
        ? 'video/webm;codecs=vp8,opus'
        : 'video/webm';
    
    mediaRecorder = new MediaRecorder(combinedStream, {
      mimeType: mimeType,
      videoBitsPerSecond: 5000000,
      audioBitsPerSecond: 128000
    });
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '苏打绿-小情歌.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      document.getElementById('status').textContent = '视频已下载！';
    };
    
    // 6. 启动录制
    mediaRecorder.start(100);
    isRecording = true;
    
    // 7. 启动背景音乐
    const audioStartTime = audioCtx.currentTime + 0.5;
    generateBackgroundMusic(audioStartTime);
    
    // 8. 开始渲染
    startTime = 0;
    animationId = requestAnimationFrame(render);
    
  } catch (err) {
    alert('录制失败: ' + err.message);
    document.getElementById('status').textContent = '错误: ' + err.message;
  }
}

document.getElementById('btnGenerate').addEventListener('click', () => {
  if (animationId) cancelAnimationFrame(animationId);
  startRecording();
});

// 初始渲染一帧
drawBackground(0);
drawLyrics(0);
drawSongInfo(0);
drawProgressBar(0);
</script>
</body>
</html>
